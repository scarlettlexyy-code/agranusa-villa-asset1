<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120d07">
<meta name="description" content="Agranusa Signature Villa Asset - sistem manajemen aset villa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agranusa Aset">
<title>Agranusa Signature Villa Asset</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
</head>
<body>
<noscript>Aplikasi ini membutuhkan JavaScript.</noscript>
<div id="boot" style="position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#120d07;color:#f0dc9b;text-align:center;padding:24px;font:15px Georgia,serif">
  <div>
    <div id="boot-msg" style="font-size:18px;font-weight:700;margin-bottom:8px">Memuat aplikasi...</div>
    <div style="font-size:12px;color:#d8c18a;max-width:420px;line-height:1.5">Agranusa Signature Villa Asset</div>
  </div>
</div>
<script>
(function(){
  var m = function (t) {
    var e = document.getElementById('boot-msg');
    if (e) e.textContent = t;
  };

  function validateApiUrl(url) {
    if (!url) return false;
    return /^https:\/\/script\.google\.com\/macros\/s\/.*\/exec$/.test(String(url).trim());
  }

  window.addEventListener('error', function (ev) {
    var ln = ev.lineno || 0;
    var sc = document.scripts;
    var L = (sc[sc.length - 1] && sc[sc.length - 1].text || '').split('\n');
    var t = (L[ln - 1] || '').slice(0, 70);
    m('Terjadi kesalahan: ' + (t || 'Kesalahan runtime'));
  });

  window.addEventListener('unhandledrejection', function (ev) {
    var t = document.getElementById('toast');
    if (t) {
      t.textContent = (ev.reason && ev.reason.message) || String(ev.reason);
      t.style.display = 'block';
    }
  });

  setTimeout(function () {
    if (window.__ready) return;

    var apiUrl = window.APP_CONFIG && window.APP_CONFIG.API_URL;
    if (!apiUrl) {
      m('Konfigurasi API belum diisi. Buka file config.js dan isi URL Web App Apps Script Anda.');
      return;
    }

    if (!validateApiUrl(apiUrl)) {
      m('URL API tidak valid. Harus berakhiran /exec dan berasal dari Apps Script Web App.');
      return;
    }

    m('Aplikasi siap. Menghubungkan ke server data...');
    window.__ready = true;
  }, 500);
})();
</script>
</body>
</html>
